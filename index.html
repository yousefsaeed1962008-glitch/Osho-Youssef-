<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo', sans-serif;
}

body{
overflow:hidden;
background:black;
color:white;
}

/* BACKGROUND */
.bg{
position:fixed;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

.overlay{
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,0.65);
z-index:-1;
}

/* SCREENS */
.screen{
display:none;
width:100%;
height:100vh;
justify-content:center;
align-items:center;
text-align:center;
}

.active{display:flex;}

/* BOX */
.box{
width:90%;
max-width:520px;
background:rgba(255,255,255,0.06);
border:1px solid rgba(255,255,255,0.1);
padding:25px;
border-radius:25px;
backdrop-filter:blur(15px);
}

/* INPUT */
input{
width:100%;
padding:15px;
border:none;
border-radius:15px;
margin:15px 0;
outline:none;
background:rgba(255,255,255,0.1);
color:white;
}

/* BUTTON */
button{
padding:12px 25px;
border:none;
border-radius:20px;
background:#ff4d88;
color:white;
cursor:pointer;
transition:.3s;
}

button:hover{transform:scale(1.05);}

/* TYPE */
#typing{
min-height:120px;
line-height:30px;
}

/* COUNTER */
.counter{
display:flex;
flex-wrap:wrap;
gap:10px;
justify-content:center;
margin:15px 0;
}

.counter div{
background:rgba(255,255,255,0.08);
padding:12px;
border-radius:15px;
min-width:80px;
}

.counter span{
font-size:24px;
font-weight:bold;
}

/* PHOTO + VIDEO */
.photo{
width:100%;
border-radius:20px;
margin-top:10px;
}

video{
width:100%;
border-radius:20px;
margin-top:10px;
}

.caption{
margin-top:10px;
opacity:0.9;
}

/* LOVE */
.love{
font-size:45px;
animation:beat 1s infinite;
}

@keyframes beat{
0%{transform:scale(1);}
50%{transform:scale(1.1);}
100%{transform:scale(1);}
}

/* MUSIC PLAYER (SPOTIFY STYLE) */
.music-player{
position:fixed;
bottom:15px;
left:50%;
transform:translateX(-50%);
width:92%;
max-width:420px;
background:rgba(20,20,20,0.75);
backdrop-filter:blur(15px);
border-radius:20px;
display:flex;
align-items:center;
gap:12px;
padding:10px;
z-index:999;
border:1px solid rgba(255,255,255,0.1);
}

.album{
width:50px;
height:50px;
border-radius:12px;
object-fit:cover;
}

.info{
flex:1;
}

.title{
font-size:14px;
margin-bottom:6px;
}

.bar{
width:100%;
height:4px;
background:rgba(255,255,255,0.2);
border-radius:10px;
overflow:hidden;
}

.progress{
height:100%;
width:0%;
background:#1db954;
}

#musicBtn{
background:#1db954;
border:none;
padding:10px 12px;
border-radius:50%;
color:white;
cursor:pointer;
}

</style>
</head>

<body>

<img class="bg" src="bg.jpg">
<div class="overlay"></div>

<!-- HEARTS -->
<script>
setInterval(()=>{
let h=document.createElement("div");
h.innerHTML="❤️";
h.style.position="fixed";
h.style.left=Math.random()*100+"vw";
h.style.top="100vh";
h.style.fontSize="20px";
h.style.animation="beat 2s linear";
document.body.appendChild(h);
setTimeout(()=>h.remove(),4000);
},300);
</script>

<!-- LOCK -->
<div id="lock" class="screen active">
<div class="box">
<h2>جاهزة😉</h2>
<input id="pass" type="password" placeholder="Password">
<button onclick="unlock()">unlock</button>
</div>
</div>

<!-- TYPE -->
<div id="type" class="screen">
<div class="box">
<p id="typing"></p>
<button id="next" style="display:none" onclick="goMain()">next</button>
</div>
</div>

<!-- MAIN -->
<div id="main" class="screen">
<div class="box">

<h2>بدايتنا 💞</h2>

<div class="counter">
<div><span id="y">0</span><p>Years</p></div>
<div><span id="d">0</span><p>Days</p></div>
<div><span id="h">0</span><p>Hours</p></div>
<div><span id="m">0</span><p>Minutes</p></div>
<div><span id="s">0</span><p>Seconds</p></div>
</div>

<p>💖 9-12-2023 💖</p>

<h4>يوم ما قولتلك بحبك ❤️</h4>
<p>11/2/2026</p>

<h4>اول خروجه لينا سوا ❤️</h4>
<p>11/5/2026</p>

<img src="your-photo.jpg" class="photo">
<p class="caption">ربنا يخليكي ليا ❤️</p>

<video controls>
<source src="video.mp4">
</video>

<h2 class="love">بحبك ❤️</h2>

<button onclick="openMsg()">❤️ massage ❤️</button>

</div>
</div>

<!-- MESSAGE -->
<div id="msg" class="screen">
<div class="box">
<p id="msgText"></p>
<button onclick="back()">memories</button>
</div>
</div>

<!-- MUSIC PLAYER -->
<div class="music-player">

<img src="album.jpg" class="album">

<div class="info">
<div class="title">Our Love Song ❤️</div>
<div class="bar"><div class="progress" id="progress"></div></div>
</div>

<button id="musicBtn" onclick="toggleMusic()">▶</button>

</div>

<audio id="music" loop>
<source src="song.mp3">
</audio>

<script>

const pass="Love";

/* NAV */
function show(id){
document.querySelectorAll(".screen").forEach(e=>e.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* LOCK */
function unlock(){
if(document.getElementById("pass").value===pass){
show("type");
type();
}else alert("Wrong password");
}

/* TYPE */
let text="شيموئتي بحبك اوي اوي اوي كل سنه ونت دايماً عيدي و كل سنة ونت معايا و كل سنة ونت منورة حياتي كلها انا بجد مبسوط بيكي اوي انت يا نونه انت الحاجه الوحيده اللي عمري ما ابعد عنها و افضل احبها و اعمل كل حاجه علشان تبقي موجوده معايا مهما حصل 💞";

let i=0;
function type(){
let el=document.getElementById("typing");
el.innerHTML="";
i=0;

let t=setInterval(()=>{
el.innerHTML+=text[i];
i++;
if(i>=text.length){
clearInterval(t);
document.getElementById("next").style.display="inline-block";
}
},45);
}

/* NEXT */
function goMain(){show("main");}

/* COUNTER */
const start=new Date("2023-12-09").getTime();

setInterval(()=>{
let now=new Date().getTime();
let diff=now-start;

document.getElementById("y").innerText=Math.floor(diff/(1000*60*60*24*365));
document.getElementById("d").innerText=Math.floor(diff/86400000);
document.getElementById("h").innerText=Math.floor(diff/3600000%24);
document.getElementById("m").innerText=Math.floor(diff/60000%60);
document.getElementById("s").innerText=Math.floor(diff/1000%60);
},1000);

/* MESSAGE */
function openMsg(){
show("msg");
document.getElementById("msgText")=
`دعيت انك تكوني معايا طول يوم عرفة انشاء الله هتكوني بتاعتي انا و هنفضل مع بعض و هننجح سوا و نعمل كل حاجه سوا وجودك مهون عليا كتير يا نونه انت احلي بنوته شافتها عيوني و مش بحبك علشان شكلك بس انت كدا كدا قمر و تتحبي انا حبيتك علشان انت اللي عرفتي تخليني رغاي و بعرف اقول كلام حلو عرفتي تخليني اسيطر علي عصبيتي علشان خايف علي زعلك ونك بتزعلي من نبرة الصوت لو عليت شوية حتي عرفتي تخليني احس بمسؤلية الحب اني اخاف عليكي اني اهتم بيكي اني محسسكيش باي حاجه وحشة ابقي مسؤول منك انا البتصرف انا اللي اعمل علشان انا الراجل ونت البنوته مسؤلية كلمه بحبك مش مجرد كلمه ده وعد اني هاجيلك وعد اني اجيب اخري علشان اوصلك انا بحبك بجد يا نونتي ♥️🫂`;
}

function back(){show("main");}

/* MUSIC */
let music=document.getElementById("music");
let btn=document.getElementById("musicBtn");
let progress=document.getElementById("progress");

function toggleMusic(){
if(music.paused){
music.play();
btn.innerHTML="⏸";
}else{
music.pause();
btn.innerHTML="▶";
}
}

/* PROGRESS */
music.addEventListener("timeupdate",()=>{
let p=(music.currentTime/music.duration)*100;
progress.style.width=p+"%";
});

/* AUTOPLAY */
window.onload=()=>music.play().catch(()=>{});

</script>

</body>
</html>
