<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo', sans-serif;
}

body{
overflow:hidden;
background:black;
}

/* BACKGROUND HEARTS */
.heart{
position:fixed;
color:#ff4d88;
font-size:20px;
animation:floatUp 6s linear infinite;
opacity:0.7;
z-index:0;
}

@keyframes floatUp{
0%{transform:translateY(100vh) scale(0.5); opacity:0;}
50%{opacity:1;}
100%{transform:translateY(-10vh) scale(1.2); opacity:0;}
}

/* SCREENS */
.screen{
width:100%;
height:100vh;
position:absolute;
top:0;
left:0;
display:none;
justify-content:center;
align-items:center;
animation:fade .7s;
}

.active{display:flex;}

@keyframes fade{
from{opacity:0; transform:scale(1.03);}
to{opacity:1; transform:scale(1);}
}

/* BACKGROUND */
.bg{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
}

.overlay{
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,.6);
backdrop-filter:blur(3px);
}

/* BOX */
.box{
z-index:2;
width:90%;
max-width:500px;
text-align:center;
color:white;
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.1);
padding:30px;
border-radius:25px;
backdrop-filter:blur(15px);
}

/* INPUT */
input{
width:100%;
padding:15px;
border:none;
border-radius:15px;
margin:15px 0;
background:rgba(255,255,255,0.1);
color:white;
outline:none;
}

/* BUTTONS */
button{
padding:12px 25px;
border:none;
border-radius:20px;
background:#ff4d88;
color:white;
cursor:pointer;
transition:.3s;
}

button:hover{transform:scale(1.05);}

/* TEXT */
h1{font-size:40px;}
p{line-height:30px;}

/* COUNTER */
.counter{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
margin:20px 0;
}

.counter div{
background:rgba(255,255,255,0.08);
padding:15px;
border-radius:15px;
min-width:80px;
}

.counter span{
font-size:28px;
font-weight:bold;
}

/* HEART TITLE */
.love{
margin-top:20px;
font-size:45px;
animation:beat 1s infinite;
}

@keyframes beat{
0%{transform:scale(1);}
50%{transform:scale(1.1);}
100%{transform:scale(1);}
}

/* MUSIC */
.music{
position:fixed;
bottom:15px;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,0.6);
padding:10px 15px;
border-radius:20px;
z-index:999;
color:white;
display:flex;
gap:10px;
align-items:center;
}

/* MOBILE */
@media(max-width:600px){
h1{font-size:28px;}
.box{padding:20px;}
}

</style>
</head>

<body>

<!-- HEARTS -->
<script>
function createHearts(){
const heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="❤";
heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(15+Math.random()*20)+"px";
heart.style.animationDuration=(3+Math.random()*3)+"s";
document.body.appendChild(heart);

setTimeout(()=>heart.remove(),6000);
}
setInterval(createHearts,300);
</script>

<!-- LOCK -->
<div id="lock" class="screen active">
<img class="bg" src="bg.jpg">
<div class="overlay"></div>

<div class="box">
<h1>جاهزة؟ 💖</h1>
<input type="password" id="pass" placeholder="Password">
<button onclick="unlock()">دخول</button>
</div>
</div>

<!-- FIRST -->
<div id="first" class="screen">
<img class="bg" src="bg.jpg">
<div class="overlay"></div>

<div class="box">
<p id="typing"></p>
<button id="next" style="display:none" onclick="goMain()">التالي</button>
</div>
</div>

<!-- MAIN -->
<div id="main" class="screen">
<img class="bg" src="bg.jpg">
<div class="overlay"></div>

<div class="box">

<h1>بدايتنا 💞</h1>

<div class="counter">
<div><span id="d">0</span><p>Days</p></div>
<div><span id="h">0</span><p>Hours</p></div>
<div><span id="m">0</span><p>Minutes</p></div>
<div><span id="s">0</span><p>Seconds</p></div>
</div>

<p>💖 9-12-2023</p>

<h2 class="love">بحبك ❤️</h2>

<button onclick="openMsg()">رسالة 💌</button>

</div>
</div>

<!-- MESSAGE -->
<div id="msg" class="screen">
<img class="bg" src="bg.jpg">
<div class="overlay"></div>

<div class="box">
<p>
أنا بحبك بجد... وجودك فرق معايا في كل حاجة ❤️
</p>
<button onclick="back()">رجوع</button>
</div>
</div>

<!-- MUSIC -->
<div class="music">
<span>🎵 Music</span>
<button onclick="toggleMusic()" id="btn">Play</button>
</div>

<audio id="music" loop>
<source src="song.mp3">
</audio>

<script>

const password="Love";

function show(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* LOCK */
function unlock(){
let v=document.getElementById("pass").value;
if(v===password){
show("first");
type();
}else alert("Wrong Password");
}

/* TYPE */
let text="أنا بحبك جدًا ❤️ وكل يوم معاك هو أجمل يوم في حياتي 💞";
let i=0;

function type(){
let el=document.getElementById("typing");
el.innerHTML="";
i=0;

let t=setInterval(()=>{
el.innerHTML+=text[i];
i++;
if(i>=text.length){
clearInterval(t);
document.getElementById("next").style.display="inline-block";
}
},60);
}

/* NAV */
function goMain(){show("main");}
function openMsg(){show("msg");}
function back(){show("main");}

/* COUNTER */
const start=new Date("2023-12-09").getTime();

setInterval(()=>{
let now=new Date().getTime();
let diff=now-start;

document.getElementById("d").innerText=Math.floor(diff/86400000);
document.getElementById("h").innerText=Math.floor(diff/3600000%24);
document.getElementById("m").innerText=Math.floor(diff/60000%60);
document.getElementById("s").innerText=Math.floor(diff/1000%60);
},1000);

/* MUSIC */
let music=document.getElementById("music");
function toggleMusic(){
let btn=document.getElementById("btn");
if(music.paused){
music.play();
btn.innerText="Pause";
}else{
music.pause();
btn.innerText="Play";
}
}

</script>

</body>
</html>
