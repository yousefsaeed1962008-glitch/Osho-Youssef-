<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo', sans-serif;
}

body{
overflow:hidden;
background:black;
}

/* BACKGROUND */
.bg{
position:fixed;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

.overlay{
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
z-index:-1;
}

/* SCREEN */
.screen{
display:none;
width:100%;
height:100vh;
justify-content:center;
align-items:center;
text-align:center;
color:white;
}

.active{display:flex;}

/* BOX */
.box{
width:90%;
max-width:500px;
background:rgba(255,255,255,0.06);
border:1px solid rgba(255,255,255,0.1);
padding:25px;
border-radius:25px;
backdrop-filter:blur(15px);
}

/* INPUT */
input{
width:100%;
padding:15px;
border:none;
border-radius:15px;
margin:15px 0;
outline:none;
background:rgba(255,255,255,0.1);
color:white;
}

/* BUTTON */
button{
padding:12px 25px;
border:none;
border-radius:20px;
background:#ff4d88;
color:white;
cursor:pointer;
transition:.3s;
}

button:hover{transform:scale(1.05);}

/* TYPE */
#typing{
min-height:120px;
line-height:30px;
}

/* COUNTER */
.counter{
display:flex;
gap:10px;
justify-content:center;
flex-wrap:wrap;
margin:15px 0;
}

.counter div{
background:rgba(255,255,255,0.08);
padding:12px;
border-radius:15px;
min-width:80px;
}

.counter span{
font-size:25px;
font-weight:bold;
}

/* HEART */
.love{
font-size:45px;
margin-top:10px;
animation:beat 1s infinite;
}

@keyframes beat{
0%{transform:scale(1);}
50%{transform:scale(1.1);}
100%{transform:scale(1);}
}

/* MUSIC PLAYER */
.music{
position:fixed;
bottom:15px;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,0.7);
padding:10px 15px;
border-radius:20px;
display:flex;
gap:10px;
align-items:center;
color:white;
z-index:999;
}

</style>
</head>

<body>

<img class="bg" src="bg.jpg">
<div class="overlay"></div>

<!-- LOCK -->
<div id="lock" class="screen active">
<div class="box">
<h2>جاهزة😉</h2>
<input type="password" id="pass" placeholder="Password">
<button onclick="unlock()">unlock</button>
</div>
</div>

<!-- TYPE -->
<div id="typePage" class="screen">
<div class="box">
<p id="typing"></p>
<button id="nextBtn" style="display:none" onclick="goMain()">next</button>
</div>
</div>

<!-- MAIN -->
<div id="main" class="screen">
<div class="box">

<h2>بدايتنا 💞</h2>

<div class="counter">
<div><span id="d">0</span><p>Days</p></div>
<div><span id="h">0</span><p>Hours</p></div>
<div><span id="m">0</span><p>Minutes</p></div>
<div><span id="s">0</span><p>Seconds</p></div>
</div>

<p>💖 9-12-2023 💖</p>

<div class="box" style="margin-top:10px">
<h4>يوم ما قولتلك بحبك ❤️</h4>
<p>11/2/2026</p>
</div>

<div class="box">
<h4>اول خروجه لينا سوا ❤️</h4>
<p>11/5/2026</p>
</div>

<div class="box">

<!-- IMAGE / VIDEO PLACE -->
<img src="your-photo.jpg" style="width:100%;border-radius:15px">

<p>ربنا يخليكي ليا ❤️</p>

<!-- VIDEO OPTIONAL -->
<video controls style="width:100%;margin-top:10px;border-radius:15px">
<source src="video.mp4">
</video>

</div>

<h2 class="love">بحبك ❤️</h2>

<button onclick="openMsg()">❤️ massage ❤️</button>

</div>
</div>

<!-- MESSAGE -->
<div id="msg" class="screen">
<div class="box">

<p id="msgText"></p>

<button onclick="back()">memories</button>

</div>
</div>

<!-- MUSIC -->
<div class="music">
<span>🎵 Song</span>
<button onclick="toggleMusic()" id="mBtn">Play</button>
</div>

<audio id="music" loop>
<source src="song.mp3">
</audio>

<script>

const password="Love";

/* SCREEN CONTROL */
function show(id){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* LOCK */
function unlock(){
if(document.getElementById("pass").value===password){
show("typePage");
type();
}else alert("Wrong password");
}

/* TYPE TEXT */
let text="شيموئتي بحبك اوي اوي اوي كل سنه ونت دايماً عيدي و كل سنة ونت معايا و كل سنة ونت منورة حياتي كلها انا بجد مبسوط بيكي اوي انت يا نونه انت الحاجه الوحيده اللي عمري ما ابعد عنها و افضل احبها و اعمل كل حاجه علشان تبقي موجوده معايا مهما حصل 💞";

let i=0;

function type(){
let el=document.getElementById("typing");
el.innerHTML="";
i=0;

let t=setInterval(()=>{
el.innerHTML+=text[i];
i++;
if(i>=text.length){
clearInterval(t);
document.getElementById("nextBtn").style.display="inline-block";
}
},50);
}

/* NEXT */
function goMain(){show("main");}

/* COUNTER */
const start=new Date("2023-12-09").getTime();

setInterval(()=>{
let now=new Date().getTime();
let d=now-start;

document.getElementById("d").innerText=Math.floor(d/86400000);
document.getElementById("h").innerText=Math.floor(d/3600000%24);
document.getElementById("m").innerText=Math.floor(d/60000%60);
document.getElementById("s").innerText=Math.floor(d/1000%60);
},1000);

/* MESSAGE */
let msgText=`دعيت انك تكوني معايا طول يوم عرفة انشاء الله هتكوني بتاعتي انا و هنفضل مع بعض و هننجح سوا و نعمل كل حاجه سوا وجودك مهون عليا كتير يا نونه انت احلي بنوته شافتها عيوني و مش بحبك علشان شكلك بس انت كدا كدا قمر و تتحبي انا حبيتك علشان انت اللي عرفتي تخليني رغاي و بعرف اقول كلام حلو عرفتي تخليني اسيطر علي عصبيتي علشان خايف علي زعلك ونك بتزعلي من نبرة الصوت لو عليت شوية حتي عرفتي تخليني احس بمسؤلية الحب اني اخاف عليكي اني اهتم بيكي اني محسسكيش باي حاجه وحشة ابقي مسؤول منك انا البتصرف انا اللي اعمل علشان انا الراجل ونت البنوته مسؤلية كلمه بحبك مش مجرد كلمه ده وعد اني هاجيلك وعد اني اجيب اخري علشان اوصلك انا بحبك بجد يا نونتي ♥️🫂`;

function openMsg(){
show("msg");
document.getElementById("msgText").innerText=msgText;
}

function back(){show("main");}

/* MUSIC */
let music=document.getElementById("music");
function toggleMusic(){
let b=document.getElementById("mBtn");
if(music.paused){
music.play();
b.innerText="Pause";
}else{
music.pause();
b.innerText="Play";
}
}

/* AUTOPLAY TRY */
window.onload=()=>{
music.play().catch(()=>{});
}

</script>

</body>
</html>
